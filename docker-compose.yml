services:
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: |
        [
          {"url": "/contracts/user-auth-api.yaml",  "name": "Auth API (internal/mobile)"},
          {"url": "/contracts/user-auth-web.yaml",  "name": "Auth Web (browser)"},
          {"url": "/contracts/recipe-catalog.yaml", "name": "Recipe Catalog"},
        ]
    volumes:
      - ./contracts:/usr/share/nginx/html/contracts:ro
    networks:
      - overm-network

networks:
  overm-network:
    external: true 

